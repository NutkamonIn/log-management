name: CI Pipeline

# สั่งให้ทำงานทุกครั้งที่มีการ Push โค้ดขึ้นกิ่ง main หรือ master
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # Job 1: Test Backend
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./backend
        run: npm install

      - name: Run Unit & Integration Tests
        working-directory: ./backend
        run: npm run test

  # Job 2: Test Build in Frontend
  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Verify Production Build
        working-directory: ./frontend
        run: npm run build
