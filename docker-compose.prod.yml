services:
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: opensearch
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.1
    container_name: opensearch-dashboards
    ports:
      - "5601:5601"
    environment:
      - OPENSEARCH_HOSTS=["https://opensearch:9200"]
      - OPENSEARCH_SSL_VERIFICATIONMODE=none
    depends_on:
      - opensearch

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: log-backend
    ports:
      - "8000:8000"
      - "5141:5141/udp"
      - "5142:5142/udp"
    environment:
      - OPENSEARCH_URL=https://admin:admin@opensearch:9200
      - JWT_SECRET=P@ssw0rdSuperSecr3t2026!#RandomXYZ
    depends_on:
      - opensearch

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: log-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Inject production Nginx config (overriding the one in Dockerfile)
      - ./frontend/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount Let's Encrypt certificates from the host machine
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

  init:
    build:
      context: .
      dockerfile: init/Dockerfile
    container_name: log-init
    depends_on:
      - opensearch
      - opensearch-dashboards
      - backend

volumes:
  opensearch-data:
